[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-research-core"
version = "0.7.0"
description = "RSI 数据筛选实验内核。"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hf = ["torch==2.10.0", "transformers==4.57.6", "peft==0.21.0", "accelerate==1.15.0", "safetensors==0.5.3"]

[project.scripts]
rsi = "rsi.commands.cli:main"

[tool.setuptools.packages.find]
include = ["rsi*"]
